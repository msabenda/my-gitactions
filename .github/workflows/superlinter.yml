---
name: Lint Code Base

# 1. Define when the workflow runs
on:
  push:
    branches: main
  pull_request:
    branches: main

permissions:
  contents: read

jobs:
  run-lint:
    runs-on: ubuntu-latest

    steps:
      # 2. Check out the code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Super-Linter needs full git history to lint only changed files
          fetch-depth: 0

      # 3. Run the Super-Linter action
      - name: Lint Code Base
        uses: super-linter/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: false # Only lint new/changed files
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
